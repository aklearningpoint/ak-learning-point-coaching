<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Portal - Assent Public School</title>
  <link rel="stylesheet" href="css/school-theme.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Tab Strip Styling */
    .tab-strip {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .tab-btn {
      background: #f1f5f9;
      color: #334155;
      border: 1px solid #cbd5e1;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }
    .tab-btn:hover { background: #e2e8f0; }
    .tab-btn.active {
      background: #1e3a8a;
      color: #ffffff;
      border-color: #1e3a8a;
      box-shadow: 0 2px 4px rgba(30, 58, 138, 0.2);
    }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }

    /* 6:9 Standard Vertical ID Card Styling */
    .official-id-card-6x9 {
      width: 280px;
      height: 420px;
      aspect-ratio: 6 / 9;
      background: #ffffff;
      border: 2px solid #0f172a;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Print Optimization: Sirf ID card print hoga */
    @media print {
      body * {
        visibility: hidden;
      }
      #idCardContainer, #idCardContainer * {
        visibility: visible;
      }
      #idCardContainer {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        display: flex;
        justify-content: center;
      }
      .btn-download-img, button {
        display: none !important;
      }
    }
  </style>
</head>
<body class="school-bg">

  <!-- Gatekeeper: Class + Roll Number Gateway -->
  <div id="studentAuthOverlay" class="auth-gate-box">
    <div class="auth-card">
      <h2><i class="fa fa-graduation-cap"></i> Student Login</h2>
      <div class="form-group">
        <label>Select Class:</label>
        <select id="loginClass" class="input-ctrl">
          <option value="Nur & Play">Nur & Play</option>
          <option value="LKG">LKG</option>
          <option value="UKG">UKG</option>
          <option value="1">Class 1</option>
          <option value="2">Class 2</option>
          <option value="3">Class 3</option>
          <option value="4">Class 4</option>
          <option value="5">Class 5</option>
        </select>
      </div>
      <div class="form-group">
        <label>Enter Roll Number:</label>
        <input type="number" id="loginRoll" class="input-ctrl" placeholder="e.g. 1, 2, 3">
      </div>
      <button onclick="verifyStudentCandidate()" class="btn-gold-wide">Proceed</button>
      <a href="index.html" class="text-link mt-2"><i class="fa fa-arrow-left"></i> Back to School Home</a>
    </div>
  </div>

  <!-- Workspace Container (Post-Verification) -->
  <div id="studentWorkspace" style="display:none;" class="student-workspace-container">
    <div class="workspace-header">
      <h2 id="welcomeBanner">Welcome, Student</h2>
      <button onclick="logoutStudent()" class="btn-sm-danger"><i class="fa fa-sign-out-alt"></i> Exit</button>
    </div>

    <!-- Navigation Tab Strip -->
    <div class="tab-strip">
      <button class="tab-btn active" onclick="switchTab('profileTab')"><i class="fa fa-user-edit"></i> Profile Details</button>
      <button class="tab-btn" onclick="switchTab('idCardTab')"><i class="fa fa-id-card"></i> Student ID Card</button>
      <button class="tab-btn" onclick="switchTab('resultTab')"><i class="fa fa-poll"></i> Results</button>
      <button class="tab-btn" onclick="switchTab('admitCardTab')"><i class="fa fa-ticket-alt"></i> Admit Card</button>
      <button class="tab-btn" onclick="switchTab('feeTab')"><i class="fa fa-receipt"></i> Fee Status</button>
    </div>

    <!-- Tab 1: Profile View & Self-Update -->
    <div id="profileTab" class="tab-pane active">
      <form id="studentDetailForm" onsubmit="saveStudentSelfDetails(event)" class="card-p4">
        <h3>Personal & Transport Information</h3>
        <div class="grid-2col">
          <div>
            <label>Register No (Admission ID):</label>
            <input type="text" id="stuRegNo" class="input-ctrl" placeholder="Enter Registration Number">
          </div>
          <div>
            <label>Father's Name:</label>
            <input type="text" id="stuFather" class="input-ctrl" required placeholder="Enter Father's Name">
          </div>
          <div>
            <label>Mother's Name:</label>
            <input type="text" id="stuMother" class="input-ctrl" required placeholder="Enter Mother's Name">
          </div>
          <div>
            <label>Gender:</label>
            <select id="stuGender" class="input-ctrl">
              <option value="Male">Male</option>
              <option value="Female">Female</option>
            </select>
          </div>
          <div>
            <label>Transport Mode:</label>
            <select id="stuTransport" class="input-ctrl">
              <option value="School Transport">School Transport</option>
              <option value="Own Private Mode">Own Private Mode</option>
            </select>
          </div>
          <div>
            <label>Primary Mobile (Mobile 1):</label>
            <input type="tel" id="stuMob1" class="input-ctrl" required placeholder="Enter Primary Mobile">
          </div>
          <div>
            <label>Secondary Mobile (Mobile 2):</label>
            <input type="tel" id="stuMob2" class="input-ctrl" placeholder="Optional Alternate Mobile">
          </div>
          <div>
            <label>Date of Birth:</label>
            <input type="date" id="stuDOB" class="input-ctrl" required>
          </div>
        </div>

        <!-- Photo Section with File Upload + Live Camera Button -->
        <div class="form-group mt-3">
          <label>Student Photograph:</label>
          <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:5px;">
            <input type="file" id="stuPhotoInput" accept="image/*" onchange="previewStudentPhoto(this)" class="input-ctrl" style="max-width:220px;">
            <button type="button" onclick="openStudentCamera()" class="tab-btn" style="background:#2563eb; color:#fff; border:none; padding:8px 14px; cursor:pointer;"><i class="fas fa-camera"></i> Open Camera</button>
          </div>
        </div>

        <button type="submit" class="btn-gold-wide mt-3">Update & Save Profile</button>
      </form>
    </div>

    <!-- Tab 2: Official 6:9 ID Card Container -->
    <div id="idCardTab" class="tab-pane">
      <div id="idCardContainer"></div>
    </div>

    <!-- Tab 3: Results -->
    <div id="resultTab" class="tab-pane">
      <div class="card-p4">
        <h3>Examination Results</h3>
        <div id="studentResultsContainer">
          <p style="color:#64748b; text-align:center; padding:20px;">Abhi koi result publish nahi kiya gaya hai.</p>
        </div>
      </div>
    </div>

    <!-- Tab 4: Admit Card -->
    <div id="admitCardTab" class="tab-pane">
      <div class="card-p4">
        <h3>Examination Admit Card</h3>
        <p style="color:#64748b; text-align:center; padding:20px;">Admit card exam schedule aane par available hoga.</p>
      </div>
    </div>

    <!-- Tab 5: Fee Status -->
    <div id="feeTab" class="tab-pane">
      <div class="card-p4">
        <h3>Fee & Dues Record</h3>
        <p style="color:#64748b; text-align:center; padding:20px;">Fee receipt counter record update ho raha hai.</p>
      </div>
    </div>

  </div>

  <script src="js/school-db.js"></script>
  <script src="js/student-portal.js"></script>
</body>
</html>
